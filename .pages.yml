    {
      "name": "angebote",
      "label": "Angebote",
      "type": "file",
      "path": "content/offers.json",
      "format": "json",
      "fields": [
        {
          "name": "offers",
          "label": "Angebote",
          "type": "object",
          "list": {
            "collapsible": {
              "collapsed": true,
              "summary": "{fields.title}"
            }
          },
          "fields": [
            {
              "name": "visible",
              "label": "Auf der Website anzeigen",
              "type": "boolean"
            },
            {
              "name": "label",
              "label": "Kleine Überschrift",
              "type": "string"
            },
            {
              "name": "title",
              "label": "Angebot",
              "type": "string",
              "required": true
            },
            {
              "name": "subtitle",
              "label": "Zusatz, z. B. + Kaffee",
              "type": "string"
            },
            {
              "name": "price",
              "label": "Preis in Euro",
              "type": "string",
              "required": true,
              "pattern": {
                "regex": "^[0-9]{1,4},[0-9]{2}$",
                "message": "Bitte mit Komma und zwei Nachkommastellen eingeben, z. B. 5,50."
              },
              "description": "Ohne Eurozeichen, z. B. 5,50."
            },
            {
              "name": "time",
              "label": "Uhrzeit, z. B. 17–21 Uhr",
              "type": "string"
            }
          ]
        }
      ]
    },
    {
      "name": "moments",
