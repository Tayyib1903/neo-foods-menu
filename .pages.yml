{
  "media": {
    "input": "uploads",
    "output": "/neo-foods-menu/uploads",
    "rename": "safe",
    "extensions": [
      "png",
      "jpg",
      "jpeg",
      "webp",
      "gif",
      "mp4",
      "webm",
      "pdf"
    ]
  },
  "content": [
    {
      "name": "speisekarte",
      "label": "Speisekarte",
      "type": "file",
      "path": "content/speisekarte.json",
      "format": "json",
      "fields": [
        {
          "name": "title",
          "label": "Name der Karte",
          "type": "string",
          "required": true
        },
        {
          "name": "card_description",
          "label": "Beschreibung auf der Startseite",
          "type": "text"
        },
        {
          "name": "pdf_visible",
          "label": "PDF-Download anzeigen",
          "type": "boolean"
        },
        {
          "name": "pdf",
          "label": "PDF-Karte",
          "type": "file",
          "description": "PDFs werden nicht aus den Preisen neu erstellt. Nach Preis- oder Allergenänderungen bitte eine aktualisierte PDF hochladen oder den PDF-Download ausschalten."
        },
        {
          "name": "sections",
          "label": "Kategorien",
          "type": "object",
          "list": {
            "collapsible": {
              "collapsed": true,
              "summary": "{fields.title}"
            }
          },
          "fields": [
            {
              "name": "title",
              "label": "Kategorie",
              "type": "string",
              "required": true
            },
            {
              "name": "visible",
              "label": "Auf der Website anzeigen",
              "type": "boolean"
            },
            {
              "name": "tagline",
              "label": "Untertitel",
              "type": "string"
            },
            {
              "name": "image",
              "label": "Kategoriebild",
              "type": "image",
              "required": true
            },
            {
              "name": "groups",
              "label": "Produktgruppen",
              "type": "object",
              "list": {
                "collapsible": {
                  "collapsed": true,
                  "summary": "{fields.title}"
                }
              },
              "fields": [
                {
                  "name": "title",
                  "label": "Gruppenüberschrift",
                  "type": "string",
                  "required": true
                },
                {
                  "name": "items",
                  "label": "Produkte",
                  "type": "object",
                  "list": {
                    "collapsible": {
                      "collapsed": true,
                      "summary": "{fields.name}"
                    }
                  },
                  "fields": [
                    {
                      "name": "name",
                      "label": "Produktname",
                      "type": "string",
                      "required": true
                    },
                    {
                      "name": "visible",
                      "label": "Auf der Website anzeigen",
                      "type": "boolean"
                    },
                    {
                      "name": "price",
                      "label": "Preis in Euro",
                      "type": "string",
                      "required": true,
                      "pattern": {
                        "regex": "^[0-9]{1,4},[0-9]{2}$",
                        "message": "Bitte mit Komma und zwei Nachkommastellen eingeben, z. B. 5,50."
                      },
                      "description": "Ohne Eurozeichen, z. B. 5,50."
                    },
                    {
                      "name": "description",
                      "label": "Beschreibung / Zutaten",
                      "type": "text"
                    },
                    {
                      "name": "allergens",
                      "label": "Allergene",
                      "type": "string",
                      "description": "Buchstaben durch Kommas trennen, z. B. A, C, G. Nur bestätigte Angaben eintragen."
                    }
                  ]
                }
              ]
            },
            {
              "name": "note_title",
              "label": "Hinweis – Überschrift",
              "type": "string"
            },
            {
              "name": "note",
              "label": "Hinweis – Text",
              "type": "text"
            }
          ]
        }
      ]
    },
