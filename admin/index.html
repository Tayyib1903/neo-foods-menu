<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>NEO FOODS – Content Manager</title>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@beta/dist/decap-cms.js"></script>

  <script>
    const observer = new MutationObserver(() => {
      const loginButton = [...document.querySelectorAll("button")]
        .find(el => el.textContent.includes("Mit GitHub einloggen"));

      if (!loginButton) return;

      let parent = loginButton.parentElement;

      while (parent) {
        const rect = parent.getBoundingClientRect();

        if (
          rect.width > window.innerWidth * 0.9 &&
          rect.height > window.innerHeight * 0.8
        ) {
          parent.style.backgroundColor = "#2e7d32";
          break;
        }

        parent = parent.parentElement;
      }
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  </script>
</body>
</html>
